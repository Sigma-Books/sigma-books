# Politique de dépendances (cargo-deny) — docs/lots/L0.md §2, ADR 0009.
# Toute modification passe par la revue de l'équipe core (CODEOWNERS).

[graph]
all-features = true

# Avis de sécurité RustSec : toute vulnérabilité, crate retirée (yanked)
# ou non maintenue signalée par un avis fait échouer la vérification.
[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono déclaré non maintenu (informatif, aucune faille connue). Entraîné par cedar-policy
    # 4.15 (ADR 0005) : cedar-policy-formatter active l'extension `datetime` de cedar-policy-core,
    # que nos politiques n'utilisent pas. Seul cet identifiant est ignoré : toute faille de
    # chrono bloquerait de nouveau. Décision du mainteneur du 2026-11-19 ; revue trimestrielle
    # (prochaine : 2027-02-19) et à chaque montée de version de Cedar (#145).
    { id = "RUSTSEC-2026-0543", reason = "chrono non maintenu, entraîné par cedar-policy sans usage ; revue au 2027-02-19 (#145)" },
]

# Licences : liste blanche, tout le reste est refusé
# (notamment GPL-2.0-only, incompatible avec l'AGPL-3.0).
[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
]
exceptions = []
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les dépendances internes du workspace (chemins, non publiées) sont permises.
allow-wildcard-paths = true

# Sources : crates.io uniquement.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
