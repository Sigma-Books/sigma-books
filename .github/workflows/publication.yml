# Publication d'une version : build reproductible, SBOM, signature Sigstore,
# provenance SLSA. PRÉPARÉ, INACTIF tant qu'aucun tag v* n'est poussé
# (création de tags réservée à l'équipe core par le ruleset « Protection des
# tags de version »). docs/lots/L0.md §4 ; docs/collaboration.md §11.
name: Publication

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BINAIRES: "api worker-documents sigma-verifier"

jobs:
  # Deux builds indépendants, dans deux chemins différents : les binaires
  # doivent être identiques octet pour octet.
  build:
    name: build (${{ matrix.copie }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        copie: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src-${{ matrix.copie }}
      - name: Build reproductible
        working-directory: src-${{ matrix.copie }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
          cargo build --release --locked
          mkdir -p "$RUNNER_TEMP/dist"
          for b in $BINAIRES; do cp "target/release/$b" "$RUNNER_TEMP/dist/"; done
          (cd "$RUNNER_TEMP/dist" && sha256sum $BINAIRES > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaires-${{ matrix.copie }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 5

  publier:
    name: publier
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Environnement protégé (approbation manuelle, docs/collaboration.md §12).
    environment: publication
    permissions:
      contents: write # création de la release
      id-token: write # signature Sigstore sans clé et attestation
      attestations: write
    env:
      CYCLONEDX_VERSION: "0.5.10"
      CYCLONEDX_SHA256: 2e4ef64a53c0a38d4b7d805c593b5f47ecd29821e98d81e484d03abaa0edb95f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artefacts
      - name: Vérifier la reproductibilité
        run: |
          diff "$RUNNER_TEMP/artefacts/binaires-a/SHA256SUMS" "$RUNNER_TEMP/artefacts/binaires-b/SHA256SUMS"
          mkdir -p dist && cp "$RUNNER_TEMP"/artefacts/binaires-a/* dist/
      - name: SBOM CycloneDX
        run: |
          archive="cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CYCLONEDX_VERSION}/${archive}"
          echo "${CYCLONEDX_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-cyclonedx-x86_64-unknown-linux-gnu/cargo-cyclonedx" cyclonedx --format json --all-features --describe crate
          find crates -name '*.cdx.json' -exec mv {} dist/ \;
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Signer (Sigstore, sans clé)
        working-directory: dist
        run: |
          for f in *; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - name: Provenance SLSA
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --draft --title "$TAG" --generate-notes
