version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-mineures:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directories: ["/web", "/site"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-mineures:
        update-types: ["minor", "patch"]
    ignore:
      # Les types de Node suivent la version majeure de Node fixée dans .node-version :
      # elle se change explicitement, avec le runtime, jamais par Dependabot seul.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
