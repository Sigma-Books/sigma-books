[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Sigma-Books/sigma-books"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Avertissements en local, bloquants en CI (`-D warnings`).
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Interdits hors tests (voir clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
