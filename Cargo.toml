[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Sigma-Books/sigma-books"
publish = false

# Versions communes du workspace. Toute ajout est justifié dans la PR
# (besoin, alternatives, licence, maintenance) et autorisé par le CLAUDE.md du crate.
[workspace.dependencies]
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["std"] }
proptest = "1.12.0"
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
sha2 = { version = "0.11.1", default-features = false, features = ["oid"] }
# Horodatage RFC 3161 (ADR 0010). x509-tsp et cms n'existent qu'en préversion pour la lignée der 0.8.
sha1 = { version = "0.11.0", default-features = false }
base64ct = { version = "1.8.3", default-features = false, features = ["alloc"] }
der = { version = "0.8.3", default-features = false, features = ["alloc", "oid", "derive"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["pem"] }
cms = { version = "=0.3.0-rc.2", default-features = false }
x509-tsp = { version = "=0.2.0-rc.0", default-features = false }
rsa = { version = "0.10.0", default-features = false, features = ["encoding", "pkcs1v15"] }
# Socle PostgreSQL du crate `api` (ADR 0004, ADR 0011). Sans TLS : le choix de l'hébergement,
# donc du chiffrement de la connexion à la base, est reporté au déploiement (L9, Q12c).
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid", "time"] }
tokio = { version = "1.54.1", default-features = false }
uuid = { version = "1.29.3", default-features = false, features = ["std", "v4"] }
# Autorisation (ADR 0005). Extensions ipaddr et decimal désactivées ; datetime est réactivée
# d'office par cedar-policy-formatter (chrono, RUSTSEC-2026-0543 ignoré, #145).
cedar-policy = { version = "4.15.0", default-features = false }
# Serveur HTTP du crate `api` (ADR 0002, Fondations §6.3 ; L2 PR 6). HTTP/1.1 seul : TLS et
# HTTP/2 relèvent du mandataire inverse (Fondations §3.3, L9).
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "tokio"] }
# Client d'horodatage du crate `api` (ADR 0010, L2-30) : corps de requête et lecture bornée de la
# réponse (déjà entraînée par axum), aléa du nonce tiré du système (déjà entraîné par uuid).
http-body-util = { version = "0.1.5", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic", "fs", "limit"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Avertissements en local, bloquants en CI (`-D warnings`).
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Interdits hors tests (voir clippy.toml).
unwrap_used = "deny"
expect_used = "deny"

# Build de publication reproductible (vérifié par .github/workflows/publication.yml).
[profile.release]
codegen-units = 1
strip = "symbols"
