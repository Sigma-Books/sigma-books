# Exceptions et listes du test de catalogue (ADR 0011 ; crates/api/tests/catalogue.rs).
#
# Chaque entrée est justifiée ; toute modification passe par la revue de l'équipe core.
# Une liste vide reste déclarée : le test refuse un fichier incomplet.

# Fonctions SECURITY DEFINER admises (elles s'exécutent avec les droits de leur propriétaire,
# donc hors de la RLS du rôle applicatif). Aucune pour l'instant ; la recherche par courriel à la
# connexion (PR 8, ADR 0012) en sera peut-être une, dédiée et auditée.
security_definer = []

# Tables en ajout seul (écritures validées, leurs lignes, chaîne, audit : PR 6 et 7) :
# le rôle applicatif n'y a ni UPDATE ni DELETE, même sur une colonne. Le test vérifie l'absence
# d'UPDATE (même sur une colonne) et de DELETE pour les rôles applicatif et de lecture d'audit.
# Les têtes d'audit n'y figurent pas : état dérivé, mis à jour sous verrou (ADR 0011, 0014).
[[ajout_seul]]
nom = "audit_cabinet"
justification = """
Entrées de la chaîne d'audit d'un cabinet (ADR 0014) : INSERT seul pour le rôle applicatif \
(ni SELECT, ni UPDATE, ni DELETE, F2.6), SELECT seul pour le rôle de lecture d'audit."""

[[ajout_seul]]
nom = "audit_dossier"
justification = """
Entrées de la chaîne d'audit d'un dossier (ADR 0014) : INSERT seul pour le rôle applicatif \
(ni SELECT, ni UPDATE, ni DELETE, F2.6), SELECT seul pour le rôle de lecture d'audit."""

# Tables d'instance : sans `cabinet_id` ni `dossier_id`, sans donnée comptable (ADR 0011,
# « Tables d'instance »). `rls = true` : la table reste sous RLS activée et forcée, avec des
# politiques pour toutes les commandes qui lisent le contexte (`sigma.…`), sans la forme imposée
# aux tables d'un cabinet. `rls = false` : aucune RLS (le rôle applicatif ne doit alors y avoir
# aucun droit utile, vérifié en revue).

[[instance]]
nom = "_sqlx_migrations"
rls = false
justification = """
Historique des migrations tenu par `sqlx migrate`. Propriété du rôle de migration ; \
le rôle applicatif n'y a aucun droit."""

[[instance]]
nom = "utilisateur"
rls = true
justification = """
Identité (ADR 0011 et 0012) : un utilisateur peut appartenir à plusieurs cabinets (spec §4.1), \
son compte existe donc hors de tout cabinet. Courriel et nom seulement, aucune donnée comptable. \
Sous RLS : visibles, l'utilisateur du contexte et les membres du cabinet du contexte ; sans \
contexte, aucune ligne. La recherche par courriel à la connexion, sans contexte, sera conçue \
en PR 8 (ADR 0012), par exemple par une fonction dédiée et auditée."""

[[instance]]
nom = "session"
rls = true
justification = """
Sessions (ADR 0012) : une session appartient à un utilisateur, hors de tout cabinet. Aucune \
donnée comptable. Sous RLS : visibles, la session dont l'empreinte du jeton est présentée \
(`sigma.jeton_session`, authentification d'une requête) et les sessions de l'utilisateur du \
contexte (`sigma.utilisateur` : liste, rotation, révocation, purge). Le jeton n'y est jamais \
stocké, seulement son empreinte SHA-256."""

# Lecture de ses propres cabinets **sans cabinet en contexte** (choix du cabinet actif,
# `GET /api/moi/cabinets`, ADR 0012) : une politique permissive `FOR SELECT` de plus, de forme
# exacte, vérifiée par le test (`sigma.cabinet` absent ET appartenance de l'utilisateur du
# contexte). Avec un cabinet en contexte, elle ne s'applique pas : seules valent les politiques
# de tenant (F1.14). Une telle politique pour toute autre commande, ou sur une table hors liste,
# fait échouer le test.

[[lecture_membre]]
nom = "appartenance"
justification = """
Appartenances de l'utilisateur du contexte, tous cabinets confondus, pour lister ses cabinets \
avant d'en choisir un. Suspension décidée par Cedar et filtrée par la requête."""

[[lecture_membre]]
nom = "cabinet"
justification = """
Cabinets dont l'utilisateur du contexte est membre actif (identifiant et nom), pour choisir \
le cabinet actif : le nom d'un cabinet où il est suspendu reste illisible. La sous-requête lit \
`appartenance`, elle-même sous RLS."""

# Tables de dossier admises sans dossier en contexte : une action du cabinet y voit tous les
# dossiers du cabinet ; avec un dossier en contexte, ce dossier seulement. Toute autre table qui
# porte `dossier_id` exige le dossier du contexte (politique `dossier_id = sigma.dossier`).

[[dossier_facultatif]]
nom = "dossier"
justification = """
Liste des dossiers du cabinet et création d'un dossier : actions du cabinet, sans dossier \
choisi (spec §4.1). L'affectation (Q5.1) est vérifiée par Cedar et par la requête."""

[[dossier_facultatif]]
nom = "acces_dossier"
justification = """
Administration des affectations et délégations (Q5.1, Q5.2) et liste des dossiers affectés à \
un utilisateur : actions du cabinet, sans dossier choisi."""
