# Tables d'instance : exceptions à la RLS (ADR 0011, « Tables d'instance »).
#
# Une table d'instance n'appartient à aucun cabinet : elle n'a ni `cabinet_id` ni `dossier_id`,
# ne contient aucune donnée comptable et n'a pas de RLS. Toute autre table du schéma doit avoir
# la RLS activée et forcée, avec des politiques pour toutes les commandes.
#
# Cette liste est lue par le test de catalogue (crates/api/tests/catalogue.rs) : une table absente
# d'ici et sans RLS fait échouer la CI. Chaque entrée est justifiée ; l'ajout d'une entrée passe
# par la revue de l'équipe core.

[[table]]
nom = "_sqlx_migrations"
justification = """
Historique des migrations tenu par `sqlx migrate`. Propriété du rôle de migration ; \
le rôle applicatif n'y a aucun droit."""

[[table]]
nom = "utilisateur"
justification = """
Identité (ADR 0011 et 0012) : un utilisateur peut appartenir à plusieurs cabinets (spec §4.1), \
son compte existe donc hors de tout cabinet. Courriel et nom seulement, aucune donnée comptable. \
Le rattachement à un cabinet passe par `appartenance`, sous RLS."""
