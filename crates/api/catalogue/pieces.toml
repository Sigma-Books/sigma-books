# Catalogue « pièces justificatives » (ADR 0015 ; L2 PR 12) : exceptions et listes du test de
# catalogue (ADR 0011 ; crates/api/tests/catalogue.rs).
#
# Un fichier par module (`crates/api/catalogue/<module>.toml`) : une voie de travail n'édite que le
# sien. Le test les lit tous et refuse une table (ou fonction) déclarée deux fois, même dans deux
# fichiers. Chaque entrée est justifiée ; toute modification passe par la revue de l'équipe core.
# Listes possibles : `security_definer`, `ajout_seul`, `instance`, `lecture_membre`,
# `dossier_facultatif` ; une liste absente d'un fichier y est vide.
#
# Aucune exception : la table `piece` (migration 0300) est une table de dossier ordinaire, sous
# la politique exacte « cabinet ET dossier du contexte ». Elle n'est pas en ajout seul au sens du
# test : le rôle applicatif y a l'UPDATE des seules colonnes de l'écart (`ecartee_le`,
# `ecartee_par`, `motif_ecart`), jamais DELETE ; le déclencheur `piece_ecart_definitif` (fonction
# ordinaire, sans SECURITY DEFINER, EXECUTE retiré à PUBLIC) rend l'écart définitif et toute autre
# colonne immuable, quel que soit le rôle (`tests/pieces.rs`).
