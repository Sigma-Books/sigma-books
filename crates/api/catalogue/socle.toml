# Catalogue « socle » : exceptions et listes du test de catalogue
# (ADR 0011 ; crates/api/tests/catalogue.rs).
#
# Un fichier par module (`crates/api/catalogue/<module>.toml`) : une voie de travail n'édite que le
# sien. Le test les lit tous et refuse une table (ou fonction) déclarée deux fois, même dans deux
# fichiers. Chaque entrée est justifiée ; toute modification passe par la revue de l'équipe core.
# Listes possibles : `security_definer`, `ajout_seul`, `instance`, `lecture_membre`,
# `dossier_facultatif` ; une liste absente d'un fichier y est vide.

# Fonctions SECURITY DEFINER admises (elles s'exécutent avec les droits de leur propriétaire,
# donc hors de la RLS du rôle applicatif). Aucune pour l'instant ; la recherche par courriel à la
# connexion (PR 8, ADR 0012) en sera peut-être une, dédiée et auditée.
security_definer = []

# Tables d'instance : sans `cabinet_id` ni `dossier_id`, sans donnée comptable (ADR 0011,
# « Tables d'instance »). `rls = true` : la table reste sous RLS activée et forcée, avec des
# politiques pour toutes les commandes qui lisent le contexte (`sigma.…`), sans la forme imposée
# aux tables d'un cabinet. `rls = false` : aucune RLS (le rôle applicatif ne doit alors y avoir
# aucun droit utile, vérifié en revue).

[[instance]]
nom = "_sqlx_migrations"
rls = false
justification = """
Historique des migrations tenu par `sqlx migrate`. Propriété du rôle de migration ; \
le rôle applicatif n'y a aucun droit."""
