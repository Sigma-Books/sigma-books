# Catalogue « tresorerie » (lot L3, PR 11 ; migrations `0540` à `0559`) : exceptions du test de catalogue
# (ADR 0011 ; crates/api/tests/catalogue.rs). Voir `socle.toml` pour le format ; toute modification
# passe par la revue de l'équipe core.
#
# Squelette posé par la PR 6 (L3-14) : aucune table encore. La PR 11 déclare ici les siennes
# (tables en ajout seul du modèle de données de `docs/lots/L3.md`, avec leur justification), sans
# éditer le fichier d'une autre voie.
#
# `compte_tresorerie` (migration 0540) est une table de dossier ordinaire (régime « C » du plan) :
# `UPDATE` des seules colonnes de configuration (nom, plafond, comptes d'écart, archivage), jamais
# `DELETE`. Ses deux fonctions de déclencheur (`compte_tresorerie_devise_de_tenue`,
# `dossier_devise_figee_tresorerie`) sont ordinaires (droits de l'appelant, sous RLS), sans
# `SECURITY DEFINER`, `EXECUTE` retiré à PUBLIC.

[[ajout_seul]]
nom = "arrete_caisse"
justification = """
Arrêté de caisse (ADR 0034 point 3, migration 0541) : comptage figé, adossé à une pièce interne \
hachée ; ni UPDATE ni DELETE pour le rôle applicatif. Un nouveau comptage est un nouvel arrêté ; \
l'écart n'est qu'une proposition de brouillon, validée par un humain (règle absolue 6)."""
