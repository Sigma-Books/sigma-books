# Catalogue « sessions et cabinets de l'utilisateur » : exceptions et listes du test de catalogue
# (ADR 0011 ; crates/api/tests/catalogue.rs).
#
# Un fichier par module (`crates/api/catalogue/<module>.toml`) : une voie de travail n'édite que le
# sien. Le test les lit tous et refuse une table (ou fonction) déclarée deux fois, même dans deux
# fichiers. Chaque entrée est justifiée ; toute modification passe par la revue de l'équipe core.
# Listes possibles : `security_definer`, `ajout_seul`, `instance`, `lecture_membre`,
# `dossier_facultatif` ; une liste absente d'un fichier y est vide.

# Table d'instance (définition des tables d'instance : `socle.toml`).
[[instance]]
nom = "session"
rls = true
justification = """
Sessions (ADR 0012) : une session appartient à un utilisateur, hors de tout cabinet. Aucune \
donnée comptable. Sous RLS : visibles, la session dont l'empreinte du jeton est présentée \
(`sigma.jeton_session`, authentification d'une requête) et les sessions de l'utilisateur du \
contexte (`sigma.utilisateur` : liste, rotation, révocation, purge). Le jeton n'y est jamais \
stocké, seulement son empreinte SHA-256."""

# Lecture de ses propres cabinets **sans cabinet en contexte** (choix du cabinet actif,
# `GET /api/moi/cabinets`, ADR 0012) : une politique permissive `FOR SELECT` de plus, de forme
# exacte, vérifiée par le test (`sigma.cabinet` absent ET appartenance de l'utilisateur du
# contexte). Avec un cabinet en contexte, elle ne s'applique pas : seules valent les politiques
# de tenant (F1.14). Une telle politique pour toute autre commande, ou sur une table hors liste,
# fait échouer le test.

[[lecture_membre]]
nom = "appartenance"
justification = """
Appartenances de l'utilisateur du contexte, tous cabinets confondus, pour lister ses cabinets \
avant d'en choisir un. Suspension décidée par Cedar et filtrée par la requête."""

[[lecture_membre]]
nom = "cabinet"
justification = """
Cabinets dont l'utilisateur du contexte est membre actif (identifiant et nom), pour choisir \
le cabinet actif : le nom d'un cabinet où il est suspendu reste illisible. La sous-requête lit \
`appartenance`, elle-même sous RLS."""
