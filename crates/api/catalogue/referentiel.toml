# Catalogue « dossier et référentiel » (PR 11 ; migration `0200_referentiel.sql`) : exceptions
# et listes du test de catalogue (ADR 0011 ; crates/api/tests/catalogue.rs).
#
# Un fichier par module (`crates/api/catalogue/<module>.toml`) : une voie de travail n'édite que le
# sien. Le test les lit tous et refuse une table (ou fonction) déclarée deux fois, même dans deux
# fichiers. Chaque entrée est justifiée ; toute modification passe par la revue de l'équipe core.
# Listes possibles : `security_definer`, `ajout_seul`, `instance`, `lecture_membre`,
# `dossier_facultatif` ; une liste absente d'un fichier y est vide.
#
# Aucune exception pour les tables du référentiel (`dossier_referentiel`, `compte`, `journal`,
# `exercice`, `periode`, `tiers`) : toutes sont des tables de dossier à la règle commune (RLS
# forcée, politique `dossier_id = sigma.dossier`, le dossier doit être en contexte). Aucune n'est
# en ajout seul, car toutes ont un état modifiable ; aucune n'accorde DELETE, et leurs UPDATE sont
# accordés colonne par colonne (vérifié par `tests/referentiel.rs`).
#
# Irréversibilité (PR 11b, migration `0201_periodes.sql`) : déclencheurs `BEFORE UPDATE … FOR EACH
# ROW`, actifs, qui appellent une fonction du même nom, sans `SECURITY DEFINER`, levant `SB001`
# sur une ligne de statut clôturé. Le test de catalogue vérifie leur forme exacte ; aucune
# politique restrictive n'est admise.

[[irreversible]]
nom = "exercice"
fonction = "exercice_irreversible"
statut_clos = "cloture"
justification = "Un exercice clôturé ne se modifie plus (spec §4.2) : seconde barrière après compta-core."

[[irreversible]]
nom = "periode"
fonction = "periode_irreversible"
statut_clos = "cloturee"
justification = "Une période clôturée ne se rouvre jamais (AUDCIF art. 22 3°) : seconde barrière après compta-core."

# Brouillard (fil-piège de la PR 11b, note d'étude de la PR 11, §6) : chaque table dont le nom
# contient `brouill` (brouillon, brouillard), hors exemptions justifiées (`[[brouillard_exempte]]`,
# aucune à ce jour), est déclarée dans une liste `[[brouillard]]` (dans le fichier du module qui la crée,
# `catalogue/brouillard.toml` pour la PR 13) **et** lue à la clôture d'une période
# (`api::base::referentiel::TABLES_BROUILLARD_LUES_A_LA_CLOTURE`). Le test de catalogue exige
# l'égalité des trois ensembles : aucune table de brouillard n'existe encore, tous sont vides.
