[package]
name = "api"
description = "Serveur applicatif"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Tests d'isolation contre un PostgreSQL réel (ADR 0011). Activée en CI par `--all-features` ;
# sans base configurée, ces tests échouent avec un message clair (README du crate).
tests-postgres = []
# Tests des pièces contre un vrai stockage objet compatible S3 avec verrouillage d'objet
# (ADR 0015). Ils sont marqués `#[ignore]` : `--all-features` (CI, sans service S3) les compile
# et les compte « ignorés », sans les exécuter. On les lance par `-- --include-ignored` ; sans
# service S3 configuré, ils échouent alors (README du crate, « Pièces »).
tests-s3 = ["tests-postgres"]

[dependencies]
authz = { path = "../authz" }
integrite = { path = "../integrite" }
aes-gcm.workspace = true
argon2.workspace = true
axum.workspace = true
base64ct.workspace = true
ctutils.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
http-body-util.workspace = true
# Client HTTP/1.1 de l'horodatage (ADR 0010) : connexion unique par requête, sans redirection.
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
rusty-s3.workspace = true
serde.workspace = true
sha1.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Lecture du nonce dans la requête figée des vecteurs (tests du client d'horodatage).
der.workspace = true
x509-tsp.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "test-util"] }
toml.workspace = true
