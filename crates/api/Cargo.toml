[package]
name = "api"
description = "Serveur applicatif"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Tests d'isolation contre un PostgreSQL réel (ADR 0011). Activée en CI par `--all-features` ;
# sans base configurée, ces tests échouent avec un message clair (README du crate).
tests-postgres = []

[dependencies]
authz = { path = "../authz" }
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util"] }
toml.workspace = true
