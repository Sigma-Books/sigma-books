# Pack pays : valeurs par défaut d'un dossier selon son pays (ADR 0027).
#
# Socle commun SYSCOHADA : un seul plan de comptes pour tous les États de l'OHADA (`comptes.toml`).
# Ce fichier ne porte que les **valeurs par défaut** du dossier à sa création (devise de tenue,
# fuseau, langue, types d'identifiants légaux) : aucun paramètre fiscal (ADR suivant, `fiscal-*`).
# Chaque entrée cite sa source (règle absolue 9). Les valeurs fournies à la création du dossier
# sont contrôlées contre les tables de ce fichier (devises, fuseaux, types d'identifiants).
#
# Fuseaux : décalage **constant** par rapport à UTC, en minutes. Vérifié contre la base IANA
# `tzdata` 2026f le 2026-11-26 : aucun de ces fuseaux n'observe l'heure d'été. Un fuseau à heure
# d'été n'a pas sa place ici (ADR 0027, point 4).
#
# Langue : `fr`, seule langue de l'interface en v1 (spec §0, « Langue : Français »).
#
# Identifiants légaux : les types communs (`[[identifiant]]` de premier niveau) valent pour tous
# les pays ; un pays en ajoute (`identifiants_propres`). Les formats nationaux ne sont pas
# sourcés dans le dépôt : aucun contrôle de format n'est imposé (valeur libre, bornée).
# NIF, IFU, NIU, NCC… des autres États entrent ici avec leur source, par une ligne de données.

