# Liste officielle des comptes du SYSCOHADA révisé (Système normal).
#
# Source qui fait foi : Acte uniforme relatif au droit comptable et à l'information financière
# et Système comptable OHADA, JO OHADA n° spécial du 15/02/2017, Titre VII, section 3
# « Liste des comptes », pages PDF 219 à 272 (pagination imprimée = page PDF - 3).
# Seuls les numéros et intitulés sont repris du texte (faits), sans les notes de bas de page.
#
# Champs de chaque compte :
# - numero, intitule : texte officiel. Coquilles manifestes corrigées, et trois numéros restitués
#   (champ `note`) ; liste dans crates/syscohada/README.md.
# - page : page PDF du document ci-dessus où figure le compte.
# - nature : déduite de l'intitulé officiel de la classe (classes 1 à 5 : bilan ; 6 et comptes
#   81, 83, 85, 87, 89 : charge ; 7 et comptes 82, 84, 86, 88 : produit ; 90-91 : hors bilan ;
#   92-99 : comptabilité analytique de gestion).
# - sens : sens normal du solde. Il ne figure PAS dans la liste officielle : déduit de la règle du
#   chiffre 9 (même document, p. PDF 216-217) et des fiches de fonctionnement des comptes (p. PDF 274
#   à 539) ; règles dans crates/syscohada/README.md. À VALIDER par un expert-comptable.
# - collectif : compte collectif de tiers (spec §5.1) ; hérité par les sous-comptes. Repris des comptes
#   « party_required » du module Tryton account_syscohada (docs/provenance/), complétés de 404, 413, 467
#   et 488 (liste dans crates/syscohada/README.md).
# - journal_tresorerie, page_fonctionnement : compte admis comme compte d'un journal de trésorerie
#   (spec §5.2), hérité par ses sous-comptes ; `page_fonctionnement` est la page PDF de la fiche
#   « Contenu et fonctionnement des comptes » (Titre VII, ch. 3, p. PDF 274 à 539) qui fonde la
#   marque. Comptes admis : 52 Banques (p. 417), 53 Établissements financiers (p. 419),
#   55 Instruments de monnaie électronique (p. 424-425), 57 Caisse (p. 428).
#   Comptes de la classe 5 exclus, et motif :
#   - 50 Titres de placement (p. 413), 51 Valeurs à encaisser (p. 415) : pas des disponibilités ;
#   - 54 Instruments de trésorerie : fonctionne contre le 52 ou le 53 (p. 420) ;
#   - 56 Banques, crédits de trésorerie et d'escompte : une dette, dont la contrepartie est le 52
#     (p. 426) ;
#   - 585, 588 Virements internes : comptes de passage à solder, ligne de contrepartie et jamais
#     compte d'un journal (p. 430-431) ;
#   - 59 Dépréciations (p. 433) ;
#   - 581, 582 : en attente du mainteneur (régies d'avances et accréditifs, cas ambigu, p. 430).
#   `journal_tresorerie = false` exclut explicitement un sous-compte d'un compte admis et
#   l'emporte sur l'héritage : 526 et 536, intérêts courus : ni encaisse ni avoir disponible
#   (les fiches des comptes 52 et 53, p. PDF 416 et 418, ne font que les lister en subdivision).

