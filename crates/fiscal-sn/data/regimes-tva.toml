# Régimes de TVA du Sénégal : liste FERMÉE des codes portés par l'étiquette fiscale d'une ligne
# d'écriture (L2, question 7.2 ; ADR 0019). Les codes sont des valeurs STABLES : on en ajoute, on
# n'en retire ni n'en renomme jamais (ils entrent dans le contenu haché des écritures).
#
# Source qui fait foi : Code général des impôts du Sénégal consolidé, DGID, janvier 2025
# (references/officiel/CGI_Senegal_consolide_2025-01_DGID.pdf). La loi n° 2025-17 du 27/09/2025
# ne modifie pas la TVA. Page = page PDF = folio imprimé du CGI. Seuls des faits sont repris
# (numéros d'articles, taux, pages), jamais le texte.
#
# Champs de chaque régime :
# - code : identifiant stable (A-Z a-z 0-9 _ -, 32 caractères au plus).
# - libelle : intitulé court, rédigé pour Sigma Books (non reproduit du CGI).
# - article, alinea : référence dans le CGI. `alinea` absent : l'article entier.
# - pages : pages PDF où figure la règle (157 à 210 : chapitre TVA).
# - exonere : régime d'exonération (un motif de motifs-exoneration.toml est alors obligatoire).
# - deduction : droit à déduction de la taxe d'amont ; `oui`, `non`, `non_sauf_chevauchement`,
#   `oui_si_declaree` (précompte), `sans_objet`, ou `non_trouve` (le texte ne le dit pas).
# - exigibilite : règle du CGI ; `fait_generateur` (art. 362-1 à 4), `encaissement`, `general`,
#   `trimestrielle` (art. 363-4), `mois_suivant` (art. 387-1), `sans_objet` ou `non_trouve`.
# - source_deduction, source_exigibilite : article (et page) qui fonde ces deux champs.
# - ligne_taxe : le régime comporte une ligne de TVA dans l'écriture ; sinon seule la ligne de base
#   est étiquetée (aucune ligne `taxe`). source_ligne_taxe : article et page qui le fondent.
# - taux : taux admis, en pourcent, décimaux exacts écrits en chaîne ; vide = pas de taux.
# - exigibilites_etiquette : valeurs d'exigibilité que l'étiquette porte pour ce régime (`debit`,
#   `encaissement`) ; vide = l'étiquette n'en porte pas (« non trouvé », sans objet, ou exonéré).
# - a_valider : à faire valider par l'expert-comptable et le fiscaliste (spec §26).
# - note : précision.
#
# Prorata de déduction et période d'exigibilité à l'encaissement : HORS étiquette (L5, lettrage).

