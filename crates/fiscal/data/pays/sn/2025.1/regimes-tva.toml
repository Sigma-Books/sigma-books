# Contrôle du 2026-11-26 : art. 355 bis relu p. 160 (PDF = folio) ; édition CGI 2025 confirmée
# identique à celle de dgid.sn. Alinéa 1 : collecte par l'intermédiaire ; alinéa 2 : collecte
# directe par le fournisseur étranger disposant de sa propre technologie ; alinéa 3 : la TVA
# s'applique aussi, le cas échéant, aux commissions des intermédiaires.
[[regime]]
code = "COLLECTE_NUM"
libelle = "TVA sur services numériques d'un fournisseur étranger : collectée par l'intermédiaire ou directement par le fournisseur, y compris sur la commission de l'intermédiaire"
article = "355 bis"
alinea = "1 à 3"
pages = [160]
deduction = "non_trouve"
exigibilite = "declaration_periodique"
source_deduction = "non trouvé dans le CGI consolidé"
source_exigibilite = "art. 363-4, p. 182 (déclaration au plus tard le 15 de janvier, avril, juillet et octobre)"
source_ligne_taxe = "art. 355 bis 1) à 3), p. 160 : TVA collectée et reversée par l'intermédiaire (1), par le fournisseur étranger disposant de sa propre technologie (2), et applicable aux commissions des intermédiaires (3)"
a_valider = true
note = "Prestations de services numériques d'un fournisseur étranger (loi 2023-18) : TVA collectée par l'intermédiaire (al. 1), ou directement par le fournisseur disposant de sa propre technologie (al. 2) ; TVA aussi sur les commissions des intermédiaires (al. 3). Modalités : arrêté n° 034269 du 08/11/2023 (p. 160). À valider par le fiscaliste."

