# Régimes de TVA du Sénégal (version 2025.1 des paramètres fiscaux ; ADR 0019 et 0030). Ce fichier
# donne, pour chaque régime GÉNÉRIQUE du socle (`data/socle/regimes-tva.toml`), ce qui relève du
# PAYS : article et pages de la source, droit à déduction et exigibilité légales, validité.
# Ce que `compta-core` suppose d'un régime (exonéré, ligne de taxe, rôles de taux admis,
# exigibilités d'étiquette) vient du socle et ne se redéfinit pas ici ; les taux (`normal`,
# `reduit`) sont dans `version.toml`.
#
# Source qui fait foi : Code général des impôts du Sénégal consolidé, DGID, janvier 2025
# (references/officiel/CGI_Senegal_consolide_2025-01_DGID.pdf). La loi n° 2025-17 du 27/09/2025
# ne modifie pas la TVA. Page = page PDF = folio imprimé du CGI. Seuls des faits sont repris
# (numéros d'articles, taux, pages), jamais le texte.
#
# Champs de chaque régime :
# - code : code du socle. Un régime du socle absent de ce fichier n'est pas offert dans ce pays.
# - libelle : intitulé court, rédigé pour Sigma Books (non reproduit du CGI).
# - article, alinea : référence dans le CGI. `alinea` absent : l'article entier.
# - pages : pages PDF où figure la règle (plage du chapitre TVA, `version.toml`).
# - deduction : droit à déduction de la taxe d'amont ; `oui`, `non`, `non_sauf_exceptions`,
#   `oui_si_declaree` (précompte), `sans_objet`, ou `non_trouve` (le texte ne le dit pas).
# - exigibilite : règle légale ; `fait_generateur` (art. 362-1 à 4), `encaissement`, `general`,
#   `declaration_periodique` (art. 363-4 : trimestrielle), `delai_apres_evenement` (art. 387-1 :
#   mois suivant), `sans_objet` ou `non_trouve`.
# - source_deduction, source_exigibilite : article (et page) qui fonde ces deux champs.
# - source_ligne_taxe : article et page qui fondent la présence ou l'absence d'une ligne de taxe.
# - a_valider : à faire valider par l'expert-comptable et le fiscaliste (spec §26).
# - note : précision.
# - debut, fin : validité facultative (AAAA-MM-JJ, inclus), appliquée à la date de l'écriture.
#
# Prorata de déduction et période d'exigibilité à l'encaissement : HORS étiquette (L5, lettrage).

