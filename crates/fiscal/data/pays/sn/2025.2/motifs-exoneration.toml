# Motifs d'exonération de TVA du Sénégal (version 2025.2 des paramètres fiscaux ; ADR 0019 et 0030),
# repris SANS CHANGEMENT de la version 2025.1, sauf cet en-tête et la ligne `document` de chaque
# entrée (la version 2025.2 cite deux documents : chaque source nomme le sien) :
# liste FERMÉE des codes portés par l'étiquette d'une ligne de base d'une opération exonérée.
# Les codes d'un pays gardent leur sens dans toutes ses versions : on en ajoute, on ne retire
# ni ne réaffecte jamais un code (ils entrent dans le contenu haché des écritures). Une fin de
# validité (`fin`) clôt un motif sans le retirer.
#
# Source : CGI du Sénégal consolidé, DGID, janvier 2025 ; page = page PDF = folio imprimé.
# - art. 361, alinéas 1 à 28 : exonérations sans droit à déduction (p. 176 à 181) ;
# - art. 380, a à f : exonérations ouvrant droit à déduction (p. 189).
#
# Le code d'un motif est `<code du régime>-<suffixe>` (règle du format haché). Le SUFFIXE est une
# clé opaque propre à ce pays : ici il reprend le numéro d'alinéa de l'art. 361 (`EXO_SANS_DEDUCTION`)
# ou la lettre de l'art. 380 (`EXO_AVEC_DEDUCTION`) pour que la correspondance avec l'ancienne
# liste (`EXO361-n`, `EXO380-x`) soit mécanique ; il ne vaut pas référence de loi, la source est
# dans les champs `article` et `alinea`.
#
# Chevauchement : les alinéas 361-14 (exportations), 361-15 (transport international de biens) et
# 361-26 (matériel agricole, jusqu'au 31 décembre 2026) sont aussi aux a, d et e de l'art. 380, qui
# ouvre droit à déduction. Choix retenu : le code de l'art. 380 ; 361-14, 361-15 et 361-26 ne sont
# PAS des codes distincts (tables [[chevauchement]]). À FAIRE VALIDER par l'expert-comptable et le
# fiscaliste (spec §26).
#
# Champs de [[motif]] : code, regime (`EXO_SANS_DEDUCTION` ou `EXO_AVEC_DEDUCTION`), article,
# alinea, pages, libelle (intitulé court rédigé pour Sigma Books), deduction (`non` ou `oui`),
# debut et fin facultatifs (AAAA-MM-JJ, inclus : validité à la date de l'écriture).
# Champs de [[chevauchement]] : article, alinea, pages, motif (code retenu), note.

