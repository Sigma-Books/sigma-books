# Socle des régimes de TVA : liste FERMÉE et STABLE des codes génériques de l'étiquette fiscale
# d'une ligne d'écriture, communs à tous les pays (ADR 0019 et 0030). Ces codes entrent dans le
# contenu haché des écritures : on en ajoute, on n'en retire ni n'en renomme jamais (un test fige
# la liste). Le taux n'est jamais dans un code : un régime taxable cite des RÔLES de taux
# (`normal`, `reduit`), dont chaque version de paramètres d'un pays donne la valeur.
#
# Ce fichier fixe ce que `compta-core` suppose d'un code, quel que soit le pays :
# - exonere : opération exonérée (un motif est alors obligatoire, interdit sinon) ;
# - ligne_taxe : le régime comporte une ligne de TVA dans l'écriture (sinon seule la base est
#   étiquetée) ;
# - roles_taux : rôles de taux admis (vide : l'étiquette n'a pas de taux) ;
# - exigibilites_etiquette : valeurs d'exigibilité que porte l'étiquette (`debit`,
#   `encaissement`) ; vide : l'étiquette n'en porte pas.
# Une version de paramètres peut n'offrir qu'une partie de ces régimes ; elle ne peut ni en créer
# ni changer leur nature. Un régime propre à un pays que ce socle ne couvre pas s'ajoute ICI.
#
# Fait générateur, pages et articles sont des faits du pays : ils sont dans le paquet du pays.

[[regime]]
code = "TAXABLE_NORMAL"
nature = "Opération imposable au taux normal"
exonere = false
ligne_taxe = true
roles_taux = ["normal"]
exigibilites_etiquette = ["debit", "encaissement"]

